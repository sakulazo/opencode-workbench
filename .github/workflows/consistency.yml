    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check de consistencia del Workbench
        run: ./workflows/commands/check-consistency.sh
